name: Zumrut
options:
  bundleIdPrefix: com.cagatayolmez
  deploymentTarget:
    iOS: "17.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  Zumrut:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.cagatayolmez.Zumrut
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Zümrüt"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Zümrüt, size en yakın namaz vakitlerini ve kıble yönünü gösterebilmek için konumunuzu kullanır."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Zümrüt, tilavetinizi dinleyip kelime kontrolü yapabilmek için mikrofonu kullanır."
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: LNJ7YSV327
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  ZumrutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZumrutTests
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.cagatayolmez.Zumrut.ZumrutTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Zumrut
    host: Zumrut
